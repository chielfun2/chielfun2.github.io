apiVersion: apps/v1
kind: Deployment

metadata:
  name: portfolio

spec:
  replicas: 2

  selector:
    matchLabels:
      app: portfolio

  template:
    metadata:
      labels:
        app: portfolio

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: portfolio
          image: ghcr.io/chielfun2/chielfun2-portfolio:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000